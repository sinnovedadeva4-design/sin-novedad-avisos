name: Copia de seguridad

on:
  schedule:
    # Cada lunes a las 04:17 UTC
    - cron: "17 4 * * 1"
  workflow_dispatch:

jobs:
  copia:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --omit=dev --no-audit --no-fund
      - run: node backup.js
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
      - name: Comprimir con contraseña
        env:
          PASS: ${{ secrets.BACKUP_PASS }}
        run: |
          if [ -z "$PASS" ]; then echo "Falta el secreto BACKUP_PASS"; exit 1; fi
          zip -P "$PASS" "copia-$(date +%Y-%m-%d).zip" copia.json
          rm copia.json
      - uses: actions/upload-artifact@v4
        with:
          name: copia-sin-novedad
          path: copia-*.zip
          retention-days: 90
